name: Release

# Push a tag like v1.0.0: builds the Go agent for six platforms with checksums, attaches them and the
# Node, Python and PowerShell agents to a GitHub release, and publishes the Docker image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Build
        working-directory: go
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=$([ "$os" = windows ] && echo .exe || true)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o ../dist/certhalo-agent-$os-$arch$ext .
          done
          cp ../powershell/CertHaloAgent.ps1 ../node/certhalo-agent.mjs ../python/certhalo_agent.py ../dist/
          cd ../dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/incubxperts/certhalo-agent:${{ steps.v.outputs.full }}
            ghcr.io/incubxperts/certhalo-agent:${{ steps.v.outputs.major }}
            ghcr.io/incubxperts/certhalo-agent:latest
          labels: |
            org.opencontainers.image.source=https://github.com/IncubXperts/certhalo-agents
            org.opencontainers.image.description=Reports internal TLS certificates to CertHalo
            org.opencontainers.image.licenses=MIT
